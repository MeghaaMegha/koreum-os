services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: koreum-postgres
    environment:
      POSTGRES_USER: koreum
      POSTGRES_PASSWORD: koreum
      POSTGRES_DB: koreum
    ports:
      - "5432:5432"
    volumes:
      - koreum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koreum"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: koreum-redis
    ports:
      - "6379:6379"
    volumes:
      - koreum_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: koreum-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://koreum:koreum@postgres:5432/koreum
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: koreum-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  koreum_pgdata:
  koreum_redisdata:
